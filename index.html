<script id="app-script">
(function(){
'use strict';

/* ============ 基础工具 ============ */
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var LT=['A','B','C','D','E','F'];
var PUNC=/[\s，。、；：""''「」《》（）()【】,.!?！？;:"'\-—_·]/g;
function norm(s){return String(s==null?'':s).replace(PUNC,'');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtLeft(){
  var ex=ui.ex;if(!ex)return '0:00';
  var left=Math.max(0,Math.round((ex.endsAt-Date.now())/1000));
  var m=Math.floor(left/60),s=left%60;
  return m+':'+(s<10?'0':'')+s;
}
function fmtDur(sec){var m=Math.floor(sec/60),s=sec%60;return m+' 分 '+(s<10?'0':'')+s+' 秒';}
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},1700);
}

/* ============ 题库 ============ */
var raw=JSON.parse(document.getElementById('quiz-data').textContent);
var TN={single:'单选题',multi:'多选题',judge:'判断题',fill:'填空题',short:'简答题'};
/* 长答案题目的要点（用于默写后自动比对，按要点给分） */
var KEYS={
  F12:['为中国人民谋幸福','为中华民族谋复兴'],
  F14:['立党为公','为民造福','科学决策','真抓实干'],
  F18:['一切从实际出发','理论联系实际','实事求是','检验真理'],
  F19:['一切为了群众','一切依靠群众','从群众中来','到群众中去'],
  F20:['警告','严重警告','撤销党内职务','留党察看','开除党籍'],
  F21:['表决权','选举权','被选举权'],
  F24:['政治意识','大局意识','核心意识','看齐意识'],
  F25:['道路自信','理论自信','制度自信','文化自信'],
  F26:['习近平总书记','核心地位','党中央权威','集中统一领导'],
  F28:['控制总量','优化结构','提高质量','发挥作用'],
  F29:['十五五','规划','建议'],
  Q1:['工人阶级的先锋队','中国人民和中华民族的先锋队','领导核心','先进生产力','先进文化','最广大人民的根本利益'],
  Q2:['拥护党的纲领','遵守党的章程','履行党员义务','执行党的决定','严守党的纪律','保守党的秘密','对党忠诚','积极工作','为共产主义奋斗终身','永不叛党'],
  Q3:['马克思列宁主义','毛泽东思想','邓小平理论','三个代表','科学发展观','习近平新时代中国特色社会主义思想'],
  Q4:['中国特色社会主义伟大旗帜','习近平新时代中国特色社会主义思想','伟大建党精神','自信自强','守正创新','踔厉奋发','勇毅前行','社会主义现代化国家','中华民族伟大复兴'],
  Q5:['十四五','十五五','中国式现代化','五年规划的建议','新质生产力','现代化产业体系','新发展格局','高水平对外开放']
};
function sortNum(a,b){return a-b;}
var banks={
  single:raw.single.map(function(x,i){return {id:'S'+(i+1),type:'single',stem:x.s,opts:x.o,ans:x.a.slice().sort(sortNum),note:x.n||''};}),
  multi:raw.multi.map(function(x,i){return {id:'M'+(i+1),type:'multi',stem:x.s,opts:x.o,ans:x.a.slice().sort(sortNum),note:x.n||''};}),
  judge:raw.judge.map(function(x,i){return {id:'J'+(i+1),type:'judge',stem:x.s,opts:['正确','错误'],ans:[x.a?0:1],note:x.n||''};}),
  fill:raw.fill.map(function(x,i){return {id:'F'+(i+1),type:'fill',stem:x.s,ans:x.a,full:x.f||x.s.replace('____',x.a[0]),long:!!x.long,keys:KEYS['F'+(i+1)]||[]};}),
  short:raw.short.map(function(x,i){return {id:'Q'+(i+1),type:'short',stem:x.s,ans:[x.a],keys:KEYS['Q'+(i+1)]||[],long:true};})
};
var TYPES=['single','multi','judge','fill','short'];
var EXAM_TYPES=['single','multi','judge'];
var ALL={};
TYPES.forEach(function(t){banks[t].forEach(function(q){ALL[q.id]=q;});});
var TOTAL=TYPES.reduce(function(n,t){return n+banks[t].length;},0);
var PRESETS={
  quick:{name:'快速测验',min:15,c:{single:7,multi:7,judge:6}},
  std:{name:'标准测验',min:30,c:{single:14,multi:13,judge:13}},
  full:{name:'全真模拟',min:60,c:{single:20,multi:20,judge:20}}
};

function ansText(q){
  if(q.type==='fill'||q.type==='short')return q.ans[0];
  if(q.type==='judge')return q.ans[0]===0?'正确（√）':'错误（×）';
  return q.ans.map(function(i){return LT[i];}).join('');
}
function usesKeys(q){return q.type==='short'||(q.type==='fill'&&q.long);}
function ansLabelName(q){return usesKeys(q)?'参考答案':'正确答案';}
function labelOf(q,i){return q.type==='judge'?(i===0?'正确':'错误'):LT[i];}
function pickedText(q,picked){
  if(!picked||!picked.length)return '';
  if(q.type==='judge')return labelOf(q,picked[0]);
  return picked.map(function(i){return LT[i];}).join('');
}
function isRight(q,picked){
  if(!picked||!picked.length)return false;
  if(q.type==='multi'){
    if(picked.length!==q.ans.length)return false;
    return q.ans.every(function(a){return picked.indexOf(a)>=0;});
  }
  return picked[0]===q.ans[0];
}
function fillOk(q,input){
  var v=norm(input);if(!v)return false;
  return q.ans.some(function(a){
    var A=norm(a);
    if(v===A)return true;
    if(v.length>=2&&A.indexOf(v)>=0)return true;
    if(A.length>=2&&v.indexOf(A)>=0)return true;
    return false;
  });
}
/* 默写作答：统计写到 / 漏掉的要点，命中 60% 以上算答对 */
function keyHits(q,input){
  var v=norm(input),keys=q.keys||[],hits=[],missed=[];
  keys.forEach(function(k){if(v.indexOf(norm(k))>=0)hits.push(k);else missed.push(k);});
  return {hits:hits,missed:missed,ratio:keys.length?hits.length/keys.length:0};
}

/* ============ 本地记录 ============ */
var KEY='dxd_quiz_v1';
var store={stats:{done:0,right:0},wrong:{},history:[]};
try{
  var saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(saved&&typeof saved==='object'){
    store.stats=Object.assign({done:0,right:0},saved.stats||{});
    store.wrong=saved.wrong||{};
    store.history=saved.history||[];
  }
}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function wrongIds(){return Object.keys(store.wrong).filter(function(id){return !!ALL[id];});}
function addWrong(id){if(!ALL[id])return;var w=store.wrong[id]||{n:0,t:0};w.n++;w.t=Date.now();store.wrong[id]=w;persist();}
function delWrong(id){if(store.wrong[id]){delete store.wrong[id];persist();}}
function record(q,ok){
  store.stats.done++;
  if(ok){store.stats.right++;if(ui.p&&ui.p.retry)delWrong(q.id);}
  else addWrong(q.id);
  persist();
}
function unrecord(q,ok){
  if(store.stats.done>0)store.stats.done--;
  if(ok){if(store.stats.right>0)store.stats.right--;}
  else delWrong(q.id);
  persist();
}

/* ============ 界面状态 ============ */
var ui={
  view:'home',ptype:'all',porder:'seq',phint:true,preset:'std',
  p:null,pfin:null,ex:null,res:null,recite:'fill',onlyWrong:false,opened:{}
};
var timerId=null;

/* ============ 视图 ============ */
function viewHome(){
  var st=store.stats;
  var rate=st.done?Math.round(st.right/st.done*100):0;
  var nw=wrongIds().length;
  var counts=TYPES.map(function(t){return TN[t].replace('题','')+' '+banks[t].length;}).join(' · ');
  return '<div class="hd"><h1>发展对象考试刷题</h1></div>'
  +'<div class="wrap nobar">'
  +'<div class="card hero">'
  +'<div class="t">题库已就绪 · 共 '+TOTAL+' 题</div>'
  +'<div class="s">'+counts+'</div>'
  +'<div class="st">本机累计练习 <b>'+st.done+'</b> 题 · 正确率 <b>'+rate+'%</b>'+(store.history.length?' · 已考 '+store.history.length+' 次':'')+'</div>'
  +'</div>'
  +'<button class="mode" data-act="go" data-v="practice"><span class="mi">✍️</span><span class="mt">练习模式<em>选择题点选作答，填空和简答可以打字默写，提交后立即对照答案</em></span><span class="arrow">›</span></button>'
  +'<button class="mode" data-act="go" data-v="exam"><span class="mi">⏱️</span><span class="mt">考试模式<em>从 90 道客观题随机抽题、限时作答、交卷自动评分</em></span><span class="arrow">›</span></button>'
  +'<button class="mode" data-act="go" data-v="recite"><span class="mi">📖</span><span class="mt">速记背诵<em>填空题原文＋简答题答案，考前一遍过</em></span><span class="arrow">›</span></button>'
  +'<div class="row2">'
  +'<button class="btn ghost" data-act="go" data-v="wrong">错题本（'+nw+'）</button>'
  +'<button class="btn ghost" data-act="reset">清除记录</button>'
  +'</div>'
  +'<p class="tip">题库来源：《发展对象考试复习提纲（下发版）》，共 '+TOTAL+' 道题。单选题第 17 题答案已由 C 改为 D。<br>把本页面收藏到手机桌面，随时可以刷题。</p>'
  +'</div>';
}

function chip(g,v,label){
  return '<button class="chip '+(ui[g]===v?'on':'')+'" data-act="chip" data-g="'+g+'" data-v="'+v+'">'+label+'</button>';
}
function viewPracticeSetup(){
  var nw=wrongIds().length;
  return '<div class="hd"><button class="back" data-act="go" data-v="home">‹</button><h1>练习模式</h1></div>'

  +'<div class="card">'
  +'<div class="lbl">选择题型</div>'

  +'<div class="lbl">出题顺序</div>'
  +'<div class="chips">'+chip('porder','seq','按顺序')+chip('porder','rand','随机打乱')+'</div>'
  +'<label class="switch"><input type="checkbox" id="hintSwitch"'+(ui.phint?' checked':'')+'> 答题后立即显示答案与解析（答案提示）</label>'
  +'</div>'
  +'<button class="btn primary block" data-act="pstart">开始练习</button>'
  +'<button class="btn ghost block" data-act="prestartwrong"'+(nw?'':' disabled')+'>只练错题（'+nw+' 题）</button>'
  +'<p class="tip">单选题点击选项即判分；多选题选好后点“确定作答”；填空题和简答题可以照着题目打字默写，提交后自动比对要点并给出参考答案，判得不准还能自己改判。</p>'
  +'</div>';
}

function pst(q){
  var p=ui.p;
  if(!p.st[q.id])p.st[q.id]={picked:[],graded:false,correct:false,revealed:false,inputRaw:'',hits:null,missed:null,auto:false};
  return p.st[q.id];
}
function optsHtml(q,st){
  var show=st.graded||st.revealed;
  return q.opts.map(function(o,i){
    var cls='opt',has=st.picked.indexOf(i)>=0;
    if(show){
      if(q.ans.indexOf(i)>=0)cls+=' ok';
      else if(has)cls+=' bad';
    }else if(has)cls+=' sel';
    var k=q.type==='judge'?(i===0?'√':'×'):LT[i];
    return '<div class="'+cls+'" data-act="pick" data-i="'+i+'"><span class="k">'+k+'</span><span class="t">'+esc(o)+'</span></div>';
  }).join('');
}
function fbBox(q,st){
  var ok=!!(st.graded&&st.correct);
  var cls=st.graded?(ok?'ok':'bad'):'info';
  var title=st.graded?(ok?'✅ 答对了':'❌ 答错了'):'💡 答案提示';
  var isWrite=(q.type==='fill'||q.type==='short');
  var rows='';
  if(st.graded&&usesKeys(q)&&st.hits){
    rows+='<div class="fr">要点命中：<b>'+st.hits.length+' / '+q.keys.length+'</b></div>';
    if(st.hits.length)rows+='<div class="fr">写到的要点：'+esc(st.hits.join('、'))+'</div>';
    if(st.missed&&st.missed.length)rows+='<div class="fr">漏掉的要点：<u>'+esc(st.missed.join('、'))+'</u></div>';
  }
  if(st.graded&&isWrite&&st.inputRaw)rows+='<div class="fr">你写的：'+esc(st.inputRaw)+'</div>';
  if(st.graded&&!isWrite&&st.picked.length)rows+='<div class="fr">你的答案：'+esc(pickedText(q,st.picked))+'</div>';
  if(usesKeys(q))rows+='<div class="fr">'+ansLabelName(q)+'：<div class="ansbox">'+esc(ansText(q))+'</div></div>';
  else rows+='<div class="fr">'+ansLabelName(q)+'：<b>'+esc(ansText(q))+'</b></div>';

  return '<div class="fb '+cls+'"><div class="ft">'+title+'</div>'+rows+'</div>';
}

/* ============ 渲染与路由 ============ */
function render(){
  var html='';
  switch(ui.view){
    case 'home':html=viewHome();break;
    case 'practice':html=ui.p?viewPractice():viewPracticeSetup();break;
    case 'pfinish':html=viewPfinish();break;
    case 'exam':html=ui.ex?viewExam():viewExamSetup();break;
    case 'result':html=viewResult();break;
    case 'recite':html=viewRecite();break;
    case 'wrong':html=viewWrong();break;
    default:html=viewHome();
  }
  app.innerHTML=html;
  autosize();
}
function autosize(){
  var t=document.getElementById('taIn');
  if(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,560)+'px';}
}
function nav(v){ui.view=v;window.scrollTo(0,0);render();}
function top(){window.scrollTo(0,0);}

/* ============ 练习逻辑 ============ */
function startPractice(retry){
  var list;
  if(retry){
    list=wrongIds().map(function(id){return ALL[id];});
  }else{
    list=ui.ptype==='all'?TYPES.reduce(function(a,t){return a.concat(banks[t]);},[]):banks[ui.ptype].slice();
    if(ui.porder==='rand')list=shuffle(list);
  }
  if(!list.length){toast('没有可练习的题目');return;}
  ui.p={list:list,retry:!!retry,i:0,st:{},input:''};
  nav('practice');
}
function finishPractice(){
  var p=ui.p,ans=0,right=0;
  p.list.forEach(function(q){var st=p.st[q.id];if(st&&st.graded){ans++;if(st.correct)right++;}});
  ui.pfin={n:p.list.length,ans:ans,right:right,retry:p.retry};
  ui.p=null;
  nav('pfinish');
}

/* ============ 考试逻辑 ============ */
function startExam(preset){
  var list=buildExam(preset);
  ui.ex={
    list:list,i:0,picked:{},sheet:false,preset:preset,min:PRESETS[preset].min,
    start:Date.now(),endsAt:Date.now()+PRESETS[preset].min*60000
  };
  nav('exam');
  clearInterval(timerId);
  timerId=setInterval(tickTimer,500);
}
function tickTimer(){
  var ex=ui.ex;
  if(!ex){clearInterval(timerId);return;}
  var el=document.getElementById('timer');
  if(el)el.textContent=fmtLeft();
  if(ex.endsAt-Date.now()<=0){clearInterval(timerId);submitExam(true);}
}
function submitExam(auto){
  var ex=ui.ex;
  if(!ex)return;
  var unanswered=ex.list.filter(function(q){return !(ex.picked[q.id]&&ex.picked[q.id].length);}).length;
  if(!auto){
    if(!confirm(unanswered?'还有 '+unanswered+' 题未作答，确定交卷吗？':'确定交卷吗？'))return;
  }
  clearInterval(timerId);
  var right=0,per=[];
  ex.list.forEach(function(q){
    var p=ex.picked[q.id]||[],ok=isRight(q,p);
    if(ok)right++;else addWrong(q.id);
    per.push({q:q,p:p,ok:ok});
  });
  var used=Math.round((Date.now()-ex.start)/1000);
  if(used>ex.min*60)used=ex.min*60;
  var score=Math.round(right/ex.list.length*100);
  store.history.unshift({t:Date.now(),score:score,total:ex.list.length,right:right,used:used});
  store.history=store.history.slice(0,20);
  persist();
  ui.res={score:score,right:right,total:ex.list.length,used:used,per:per,onlyWrong:false,preset:ex.preset};
  ui.ex=null;
  nav('result');
  toast(auto?'时间到，已自动交卷':'已交卷，成绩已生成');
}
function exitExam(){
  if(!ui.ex)return;
  if(!confirm('退出后本次考试作答不保存，确定退出吗？'))return;
  clearInterval(timerId);
  ui.ex=null;
  nav('exam');
}

/* ============ 交互 ============ */
app.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='esheetclose'){
    if(el.classList.contains('overlay')&&e.target.closest('.sheetbox'))return;
    ui.ex.sheet=false;render();return;
  }
  switch(act){
    case 'go':ui.p=null;ui.ex=null;clearInterval(timerId);nav(el.getAttribute('data-v'));break;
    case 'home':ui.p=null;ui.ex=null;ui.res=null;clearInterval(timerId);nav('home');break;
    case 'chip':ui[el.getAttribute('data-g')]=el.getAttribute('data-v');render();break;
    case 'pstart':startPractice(false);break;
    case 'prestartwrong':startPractice(true);break;
    case 'prestart':startPractice(ui.pfin?ui.pfin.retry:false);break;
    case 'pnext':{
      var p=ui.p;
      if(p.i<p.list.length-1){p.i++;p.input='';top();render();}
      else finishPractice();
      break;
    }
    case 'pprev':{var p2=ui.p;if(p2.i>0){p2.i--;p2.input='';top();render();}break;}
    case 'preveal':{
      var q=ui.p.list[ui.p.i],st=pst(q);
      if(st.graded)break;
      st.revealed=!st.revealed;render();break;
    }
    case 'pick':{
      var qq=ui.p.list[ui.p.i],s1=pst(qq);
      if(s1.graded||s1.revealed)break;
      var i=parseInt(el.getAttribute('data-i'),10);
      if(qq.type==='multi'){
        s1.picked=s1.picked.indexOf(i)>=0?s1.picked.filter(function(x){return x!==i;}):s1.picked.concat([i]).sort(sortNum);
      }else{
        s1.picked=[i];
        if(ui.phint){s1.correct=isRight(qq,s1.picked);s1.graded=true;record(qq,s1.correct);}
      }
      render();break;
    }
    case 'fsubmit':{
      var q3=ui.p.list[ui.p.i],s3=pst(q3);
      if(s3.graded)break;
      if(q3.type==='fill'||q3.type==='short'){
        var v='';
        if(usesKeys(q3)){var ta=document.getElementById('taIn');v=ta?ta.value:'';}
        else{var inp=document.getElementById('fillIn');v=inp?inp.value:'';}
        if(!norm(v)){toast('先写点内容再提交');break;}
        s3.inputRaw=v;
        if(usesKeys(q3)){
          var kr=keyHits(q3,v);
          s3.hits=kr.hits;s3.missed=kr.missed;s3.auto=true;
          s3.correct=kr.ratio>=0.6;
        }else{
          s3.correct=fillOk(q3,v);
        }
        s3.graded=true;record(q3,s3.correct);
      }else{
        if(!s3.picked.length){toast('请先选择答案');break;}
        s3.correct=isRight(q3,s3.picked);s3.graded=true;record(q3,s3.correct);
      }
      render();break;
    }
    case 'fhint':{
      var q4=ui.p.list[ui.p.i];
      if(usesKeys(q4)){toast('提示：这道题要答出 '+q4.keys.length+' 个要点');}
      else{var a4=q4.ans[0];toast('提示：共 '+norm(a4).length+' 个字，首字是「'+a4.charAt(0)+'」');}
      break;
    }
    case 'flip':{
      var q5=ui.p.list[ui.p.i],s5=pst(q5);
      if(!s5.graded)break;
      unrecord(q5,s5.correct);
      s5.correct=!s5.correct;s5.auto=false;
      record(q5,s5.correct);
      toast(s5.correct?'已改为“答对”':'已改为“答错”，并加入错题本');
      render();break;
    }
    case 'pexit':ui.p=null;nav('practice');break;
    case 'estart':startExam(ui.preset);break;
    case 'epick':{
      var ex=ui.ex,q6=ex.list[ex.i],i6=parseInt(el.getAttribute('data-i'),10);
      var cur=ex.picked[q6.id]||[];
      if(q6.type==='multi'){
        cur=cur.indexOf(i6)>=0?cur.filter(function(x){return x!==i6;}):cur.concat([i6]).sort(sortNum);
      }else{
        cur=[i6];
      }
      ex.picked[q6.id]=cur;
      render();break;
    }
    case 'enext':if(ui.ex.i<ui.ex.list.length-1){ui.ex.i++;top();render();}break;
    case 'eprev':if(ui.ex.i>0){ui.ex.i--;top();render();}break;
    case 'esheet':ui.ex.sheet=true;render();break;
    case 'ejump':ui.ex.i=parseInt(el.getAttribute('data-i'),10);ui.ex.sheet=false;top();render();break;
    case 'submit':submitExam(false);break;
    case 'exitexam':exitExam();break;
    case 'again':startExam(ui.res.preset);break;
    case 'onlywrong':ui.res.onlyWrong=!ui.res.onlyWrong;render();break;
    case 'rectab':ui.recite=el.getAttribute('data-v');top();render();break;
    case 'shortshow':{var k='sh'+el.getAttribute('data-i');ui.opened[k]=!ui.opened[k];render();break;}
    case 'delwrong':delWrong(el.getAttribute('data-id'));render();break;
    case 'clearwrong':if(confirm('确定清空错题本吗？')){store.wrong={};persist();render();}break;
    case 'reset':if(confirm('确定清除本机全部练习记录、错题和成绩吗？')){store={stats:{done:0,right:0},wrong:{},history:[]};persist();render();}break;
  }
});
app.addEventListener('input',function(e){
  if(!e.target||!ui.p)return;
  var id=e.target.id;
  if(id!=='fillIn'&&id!=='taIn')return;
  ui.p.input=e.target.value;
  var cur=ui.p.list[ui.p.i];
  if(cur)pst(cur).draft=e.target.value;
  if(id==='taIn'){
    e.target.style.height='auto';
    e.target.style.height=Math.min(e.target.scrollHeight,560)+'px';
  }
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='fillIn'){
    e.preventDefault();
    var b=app.querySelector('[data-act="fsubmit"]');
    if(b)b.click();
  }
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='hintSwitch')ui.phint=e.target.checked;
});

render();
})();
</script>
</body>
</html>
